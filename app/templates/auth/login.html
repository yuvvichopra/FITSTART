{% extends "base.html" %}

{% block title %}Log In | FitStart{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <h1 class="page-title" style="font-size: 1.6rem;">Welcome to FitStart</h1>
            <p class="page-subtitle">Log in to view your plans and track your progression</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="login_id" class="form-label">Username or Email</label>
                <input type="text" id="login_id" name="login_id" class="form-control" placeholder="e.g. rahul or rahul@domain.com" required autofocus>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember" value="true">
                    <span>Remember me</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Log In</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color); font-size: 0.9rem;">
            <p>New to FitStart? <a href="{{ url_for('auth.register') }}" style="font-weight: 600;">Create your account</a></p>
        </div>
    </div>
</div>
{% endblock %}
