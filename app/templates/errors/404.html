{% extends "base.html" %}

{% block title %}Page Not Found - 404 | FitStart{% endblock %}

{% block content %}
<div class="card" style="text-align: center; max-width: 550px; margin: 3rem auto; padding: 3rem 2rem;">
    <div style="font-size: 3rem; margin-bottom: 1rem;">🧭</div>
    <h1 class="page-title" style="font-size: 2rem;">404 - Page Not Found</h1>
    <p style="color: var(--charcoal-muted); margin-bottom: 1.5rem;">
        The page or resource you requested could not be located. It might have moved or the link may be outdated.
    </p>
    <div>
        <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('main.index') }}" class="btn btn-primary">Return to Dashboard</a>
    </div>
</div>
{% endblock %}
