{% extends "base.html" %}

{% block title %}Server Error - 500 | FitStart{% endblock %}

{% block content %}
<div class="card" style="text-align: center; max-width: 550px; margin: 3rem auto; padding: 3rem 2rem;">
    <div style="font-size: 3rem; margin-bottom: 1rem;">⚠️</div>
    <h1 class="page-title" style="font-size: 2rem;">500 - Internal Server Error</h1>
    <p style="color: var(--charcoal-muted); margin-bottom: 1.5rem;">
        An unexpected error occurred while processing your request. The engineering system has logged this incident.
    </p>
    <div>
        <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('main.index') }}" class="btn btn-primary">Return Home</a>
    </div>
</div>
{% endblock %}
