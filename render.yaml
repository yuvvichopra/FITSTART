services:
  - type: web
    name: fitstart-app
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fitstart-db
          property: connectionString

databases:
  - name: fitstart-db
    plan: free
    region: oregon
    databaseName: fitstart
    user: fitstart_user
